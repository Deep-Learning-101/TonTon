name: Generate sitemap

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: generate-sitemap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 取得完整歷史，避免 non-fast-forward
          persist-credentials: true
          clean: true

      - name: Ensure latest remote is present
        run: |
          # 取得並同步遠端 main，確保工作目錄乾淨且與 origin/main 一致
          git fetch origin main --prune
          git checkout main
          git reset --hard origin/main

      - name: Generate sitemap.xml
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://twman.org

      - name: Configure git for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push sitemap if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f sitemap.xml ]; then
            if git status --porcelain | grep -q .; then
              git add sitemap.xml
              git commit -m "chore: update sitemap.xml" || echo "No commit needed"
              git push origin main
            else
              echo "No changes to commit"
            fi
          else
            echo "sitemap.xml not found, skipping commit"
          fi