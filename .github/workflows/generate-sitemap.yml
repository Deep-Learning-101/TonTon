name: Generate sitemap

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: generate-sitemap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # 取得完整歷史，避免 non-fast-forward
          persist-credentials: true
          clean: true

      - name: Ensure latest remote is present (force-clean + remove local sitemap)
        run: |
          # 避免任何 unstaged 的 sitemap.xml 阻塞 pull/rebase：先刪掉 local 的 sitemap.xml
          rm -f sitemap.xml

          # 防護設定：避免自動 pull 時使用 rebase
          git config --global pull.rebase false
          git config --global --add safe.directory /github/workspace

          # 取得並同步遠端 main，並強制清理工作目錄（丟棄任何 unstaged/untracked/ignored 變更）
          git fetch --all --prune
          git checkout --force main
          git reset --hard origin/main
          git clean -fdx          # remove untracked files, directories, and ignored files

          # debug: 列出是否仍有變更（空代表乾淨）
          git status --porcelain || true
          git rev-parse --abbrev-ref HEAD || true
          git rev-parse HEAD || true

      - name: Generate sitemap.xml
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://twman.org

      - name: Configure git for actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push sitemap if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f sitemap.xml ]; then
            if git status --porcelain | grep -q .; then
              git add sitemap.xml
              git commit -m "chore: update sitemap.xml" || echo "No commit needed"
              git push origin main
            else
              echo "No changes to commit"
            fi
          else
            echo "sitemap.xml not found, skipping commit"
          fi